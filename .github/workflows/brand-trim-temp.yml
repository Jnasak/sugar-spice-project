name: Temporary brand canvas trim

on:
  push:
    branches:
      - design/redesign-candidate-20261007

permissions:
  contents: write

jobs:
  trim-brand-masters:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/redesign-candidate-20261007

      - name: Ensure ImageMagick
        shell: bash
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Trim transparent perimeter only
        shell: bash
        run: |
          set -euo pipefail
          convert assets/brand/sugar-spice-project-logo.png -trim +repage assets/brand/sugar-spice-project-logo-web.png
          convert assets/brand/sugar-spice-wordmark.png -trim +repage assets/brand/sugar-spice-wordmark-web.png
          echo "Project master: $(identify -format '%wx%h' assets/brand/sugar-spice-project-logo.png)"
          echo "Project web:    $(identify -format '%wx%h' assets/brand/sugar-spice-project-logo-web.png)"
          echo "Wordmark master: $(identify -format '%wx%h' assets/brand/sugar-spice-wordmark.png)"
          echo "Wordmark web:    $(identify -format '%wx%h' assets/brand/sugar-spice-wordmark-web.png)"

      - name: Commit derivatives only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/sugar-spice-project-logo-web.png assets/brand/sugar-spice-wordmark-web.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "asset: add trimmed web brand derivatives"
          git push origin HEAD:design/redesign-candidate-20261007
