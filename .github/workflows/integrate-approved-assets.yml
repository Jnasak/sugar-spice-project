name: Integrate approved Sugar Spice assets

on:
  push:
    branches:
      - build/option2-production-ready-20261009

permissions:
  contents: write

jobs:
  integrate-approved-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled build branch
        uses: actions/checkout@v4
        with:
          ref: build/option2-production-ready-20261009
          fetch-depth: 0

      - name: Decode and verify approved book asset
        shell: bash
        run: |
          set -euo pipefail
          test -f .asset-transfer/READY
          mkdir -p assets/book assets/media
          cat .asset-transfer/book-00.b64 .asset-transfer/book-01.b64 .asset-transfer/book-02.b64 | base64 --decode > assets/book/for-girls-only-cover-web.webp
          test "$(stat -c%s assets/book/for-girls-only-cover-web.webp)" = "260776"
          echo "6b375ae5a7905ebf5f24b23de63f4f1f7022da5a  assets/book/for-girls-only-cover-web.webp" | sha1sum -c -
          test -f assets/media/sugar-spice-campaign-board.jpeg
          test "$(stat -c%s assets/media/sugar-spice-campaign-board.jpeg)" = "108141"
          echo "006be52a1dc78eefe4f3f5f1d28e4a34617daaea  assets/media/sugar-spice-campaign-board.jpeg" | sha1sum -c -

      - name: Commit verified approved binaries and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/book/for-girls-only-cover-web.webp assets/media/sugar-spice-campaign-board.jpeg
          git rm -r .asset-transfer
          git rm .github/workflows/integrate-approved-assets.yml
          git commit -m "build: integrate approved book and campaign binaries"
          git push origin HEAD:build/option2-production-ready-20261009
